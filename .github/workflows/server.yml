name: Server

on:
  push:
    paths: ["server/**", "online/**", "tools/net_bot.c", "tools/build_server.py", "tests/net_server_check.py", "tests/net_server_economy_check.py", "tests/actor_lab.py", "tests/actor_lab.c", "tests/actor_cases/**", "tests/actor_server_check.py", "runtime/net/**", "tests/net_client_check.py", "tests/net_client_main.c", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "online/**", "tools/net_bot.c", "tools/build_server.py", "tests/net_server_check.py", "tests/net_server_economy_check.py", "tests/actor_lab.py", "tests/actor_lab.c", "tests/actor_cases/**", "tests/actor_server_check.py", "runtime/net/**", "tests/net_client_check.py", "tests/net_client_main.c", ".github/workflows/server.yml"]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y clang
      - run: CC=clang python tests/net_server_check.py
      - run: CC=clang python tests/net_server_economy_check.py
      # The actors add-on: the owner rules' replay lab on a virtual clock, then the add-on through the real server.
      - run: CC=clang python tests/actor_lab.py
      - run: CC=clang python tests/actor_server_check.py
      - run: CC=gcc python tools/build_server.py --out build/server-gcc
      # The game's online client (runtime/net/net_client.c) against the real server and bots, the runtime replaced by shims.
      - run: CC=clang python tests/net_client_check.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The runner's own C:\msys64 with UCRT64 Clang added, where build_server.py and the client check look for it.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          install: mingw-w64-ucrt-x86_64-clang
      - run: Add-Content $env:GITHUB_PATH 'C:\msys64\ucrt64\bin'
      - run: python tests/net_server_check.py
      - run: python tests/net_server_economy_check.py
      - run: python tests/actor_lab.py
      - run: python tests/actor_server_check.py
      - run: python tests/net_client_check.py
