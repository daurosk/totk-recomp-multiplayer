name: Server

on:
  push:
    paths: ["server/**", "online/**", "tools/net_bot.c", "tools/build_server.py", "tests/net_server_check.py", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "online/**", "tools/net_bot.c", "tools/build_server.py", "tests/net_server_check.py", ".github/workflows/server.yml"]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y clang
      - run: CC=clang python tests/net_server_check.py
      - run: CC=gcc python tools/build_server.py --out build/server-gcc
